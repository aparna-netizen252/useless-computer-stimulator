    class SoundSynthesizer {
      constructor() {
        this.ctx = null;
        this.enabled = true;

      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch(e) {}
      }
      playNotification() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now);
          gain1.gain.setValueAtTime(0.14, now);
          gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.18);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.09);
          gain2.gain.setValueAtTime(0.16, now + 0.09);
          gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.09);
          osc2.stop(now + 0.35);
        } catch(e) {}
      }

          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

          gain.connect(this.ctx.destination);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.25);

        } catch(e) {}

    // --- CONTEXT: TOAST SYSTEM ---
    const ToastContext = createContext(null);
    function ToastProvider({ children }) {
      const [toasts, setToasts] = useState([]);

      const removeToast = useCallback((id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      }, []);

      const addToast = useCallback((toast) => {
        const id = 'toast_' + Math.random().toString(36).substring(2, 9);
        const newToast = { ...toast, id };
        setToasts((prev) => {
          const trimmed = prev.length >= 5 ? prev.slice(prev.length - 4) : prev;
          return [...trimmed, newToast];
        });

        if (toast.type === 'achievement') {
          soundEngine.playFanfare();
          try {
            if (window.confetti) {
              window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.85, x: 0.85 } });
            }
          } catch(e) {}
        } else if (toast.type === 'error') {
          soundEngine.playError();
        } else {
          soundEngine.playNotification();
        }

        const dur = toast.duration ?? 4500;
        if (dur > 0) {
          setTimeout(() => removeToast(id), dur);
        }
        return id;
      }, [removeToast]);

      const showUselessMessage = useCallback((message, title = 'Useless Computer', type = 'warning') => {
        addToast({ title, message, type });
      }, [addToast]);

      return (
        <ToastContext.Provider value={{ toasts, addToast, removeToast, showUselessMessage }}>
          {children}
        </ToastContext.Provider>
      );
    }
    const useToast = () => useContext(ToastContext);

    // --- CONTEXT: WINDOW MANAGER ---
    const WindowContext = createContext(null);
    function WindowProvider({ children }) {
      const [windows, setWindows] = useState([]);
      const [activeWindowId, setActiveWindowId] = useState(null);
      const [bsodOpen, setBsodOpen] = useState(false);
      const nextZRef = useRef(10);
      const { showUselessMessage } = useToast();

      const focusWindow = useCallback((id) => {
        nextZRef.current += 1;
        const newZ = nextZRef.current;
        setActiveWindowId(id);
        setWindows((prev) =>
          prev.map((w) => (w.id === id ? { ...w, zIndex: newZ, isMinimized: false } : w))
        );
      }, []);

      const openWindow = useCallback((appId) => {
        soundEngine.playClick();
        const appDef = FAKE_APPS.find((a) => a.id === appId);

        if (appDef?.directAction === 'refuse-files' || appDef?.directAction === 'refuse-folder') {
          soundEngine.playError();
          showUselessMessage(REQUIRED_MESSAGES.FILE_ICON, appDef.title, 'warning');
          return;
        }

        const existing = windows.find((w) => w.appId === appId);
        if (existing) {
          if (existing.isMinimized) {
            setWindows((prev) =>
              prev.map((w) => (w.id === existing.id ? { ...w, isMinimized: false } : w))
            );
          }
          focusWindow(existing.id);
          return;
        }

        const screenW = window.innerWidth || 1200;
        const screenH = window.innerHeight || 800;
        const appWidth = Math.min(appDef?.defaultWidth || 560, screenW - 40);
        const appHeight = Math.min(appDef?.defaultHeight || 440, screenH - 120);
        const offset = (windows.length % 6) * 28;
        const initialX = Math.max(20, Math.floor((screenW - appWidth) / 2) + offset - 60);
        const initialY = Math.max(20, Math.floor((screenH - appHeight - 60) / 2) + offset - 40);

        nextZRef.current += 1;
        const newZ = nextZRef.current;

        const newWin = {
          id: 'win_' + Math.random().toString(36).substring(2, 9),
          appId,
          title: appDef?.title || 'Application',
          iconName: appDef?.iconName || 'Square',
          isMinimized: false,
          isMaximized: false,
          position: { x: initialX, y: initialY },
          size: { width: appWidth, height: appHeight },
          zIndex: newZ,
        };

        setWindows((prev) => [...prev, newWin]);
        setActiveWindowId(newWin.id);

        if (appId === 'printer') {
          showUselessMessage(REQUIRED_MESSAGES.PRINT, 'Printer Simulator', 'printer');
        } else if (appId === 'settings') {
          showUselessMessage(REQUIRED_MESSAGES.SETTINGS, 'Settings', 'info');
        } else if (appId === 'recycle-bin') {
          showUselessMessage(REQUIRED_MESSAGES.RECYCLE_BIN, 'Recycle Bin', 'warning');
        }
      }, [windows, focusWindow, showUselessMessage]);

      const closeWindow = useCallback((id) => {
        soundEngine.playClick();
        setWindows((prev) => prev.filter((w) => w.id !== id));
        setActiveWindowId((prev) => (prev === id ? null : prev));
      }, []);

      const minimizeWindow = useCallback((id) => {
        soundEngine.playClick();
        setWindows((prev) =>
          prev.map((w) => (w.id === id ? { ...w, isMinimized: true } : w))
        );
        setActiveWindowId((prev) => (prev === id ? null : prev));
      }, []);

      const toggleMaximizeWindow = useCallback((id) => {
        soundEngine.playClick();
        setWindows((prev) =>
          prev.map((w) => (w.id === id ? { ...w, isMaximized: !w.isMaximized } : w))
        );
      }, []);

      const updatePosition = useCallback((id, position) => {
        setWindows((prev) =>
          prev.map((w) => (w.id === id ? { ...w, position } : w))
        );
      }, []);

      const triggerBSOD = useCallback(() => {
        soundEngine.playError();
        setBsodOpen(true);
      }, []);

      const closeBSOD = useCallback(() => {
        soundEngine.playClick();
        setBsodOpen(false);
      }, []);

      return (
        <WindowContext.Provider
          value={{
            windows,
            activeWindowId,
            openWindow,
            closeWindow,
            minimizeWindow,
            toggleMaximizeWindow,
            focusWindow,
            updatePosition,
            bsodOpen,
            triggerBSOD,
            closeBSOD,
          }}
        >
          {children}
        </WindowContext.Provider>
      );
    }

    // --- HOOK: CLICK STREAK TRACKER ---
    function useClickTracker() {
      const { showUselessMessage, addToast } = useToast();
      const clickCountMap = useRef(new Map());
      const startClickCount = useRef(0);

      const registerClick = useCallback((targetId, customMsg) => {
        const now = Date.now();
        const current = clickCountMap.current.get(targetId) || { count: 0, lastTime: 0 };
        const count = now - current.lastTime < 3500 ? current.count + 1 : 1;
        clickCountMap.current.set(targetId, { count, lastTime: now });

        if (CLICK_STREAK_MESSAGES[count]) {
          const isAch = count === 10;
          addToast({
            title: isAch ? 'Achievement Unlocked!' : 'Persistence Detected',
            message: CLICK_STREAK_MESSAGES[count],
            type: isAch ? 'achievement' : 'warning',
            duration: 5000,
          });
          return;
        }
        if (customMsg) showUselessMessage(customMsg);
      }, [showUselessMessage, addToast]);

      const registerStartClick = useCallback(() => {
        startClickCount.current += 1;
        const count = startClickCount.current;
        if (count >= 2 && count <= 5) {
          const msg = START_MENU_SPAM_MESSAGES[Math.min(count - 2, START_MENU_SPAM_MESSAGES.length - 1)];
          showUselessMessage(msg, 'Start Menu', 'warning');
        }
      }, [showUselessMessage]);

      return { registerClick, registerStartClick };
    }

    // 7. Paint App
    function PaintApp() {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [color, setColor] = useState('#38bdf8');
      const [strokeCount, setStrokeCount] = useState(0);
      const { showUselessMessage } = useToast();

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }, []);

      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const rect = canvas.getBoundingClientRect();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const rect = canvas.getBoundingClientRect();
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
      };

      const stopDrawing = () => {
        if (isDrawing) {
          setIsDrawing(false);
          setStrokeCount((prev) => {
            const next = prev + 1;
            if (next % 4 === 0) {
              soundEngine.playError();
              showUselessMessage('Artistic ability not detected.', 'Useless Paint', 'warning');
            }
            return next;
          });
        }
      };

      const clearCanvas = () => {
        soundEngine.playClick();
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        showUselessMessage('Canvas wiped. It was probably for the best.', 'Paint', 'info');
      };

      const saveArt = () => {
        soundEngine.playError();
        showUselessMessage('Artistic ability not detected. Masterpiece denied.', 'Paint', 'error');
      };

      return (
        <div className="flex flex-col h-full bg-slate-900/95 text-slate-100 select-none overflow-hidden font-sans">
          <div className="flex items-center gap-3 px-4 py-2 bg-slate-950/70 border-b border-slate-800">
            <span className="text-xs font-bold text-slate-200">Useless Paint</span>
            <div className="flex items-center gap-1.5 ml-2">
              {['#38bdf8', '#f43f5e', '#10b981', '#fbbf24', '#a855f7', '#f8fafc'].map((c) => (
                <button
                  key={c}
                  onClick={() => { setColor(c); soundEngine.playClick(); }}
                  style={{ backgroundColor: c }}
                  className={`w-5 h-5 rounded-full border transition-transform ${color === c ? 'scale-125 border-white' : 'border-transparent'}`}
                />
              ))}
            </div>
            <div className="ml-auto flex items-center gap-2">
              <button onClick={clearCanvas} className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300">
                Clear
              </button>
              <button onClick={saveArt} className="px-2.5 py-1 rounded bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 text-xs font-medium">
                Save
              </button>
            </div>
          </div>

          <div className="flex-1 bg-slate-950 flex items-center justify-center p-3">
            <canvas
              ref={canvasRef}
              width={620}
              height={400}
              onMouseDown={startDrawing}
              onMouseMove={draw}
              onMouseUp={stopDrawing}
              onMouseLeave={stopDrawing}
              className="rounded-xl border border-slate-800 cursor-crosshair"
            />
          </div>
        </div>
      );
    }

    // --- WINDOW COMPONENT ---
    function FakeWindow({ win }) {
      const { activeWindowId, focusWindow, closeWindow, minimizeWindow, toggleMaximizeWindow, updatePosition } = useWindowManager();
      const [isDragging, setIsDragging] = useState(false);
      const dragOffset = useRef({ x: 0, y: 0 });
      const isActive = activeWindowId === win.id;

      const handleMouseDownHeader = (e) => {
        if (win.isMaximized) return;
        focusWindow(win.id);
        setIsDragging(true);
        dragOffset.current = {
          x: e.clientX - win.position.x,
          y: e.clientY - win.position.y,
        };
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging) return;
          const newX = Math.max(10, Math.min(e.clientX - dragOffset.current.x, (window.innerWidth || 1200) - 100));
          const newY = Math.max(10, Math.min(e.clientY - dragOffset.current.y, (window.innerHeight || 800) - 100));
          updatePosition(win.id, { x: newX, y: newY });
        };
        const handleMouseUp = () => {
          if (isDragging) setIsDragging(false);
        };
        if (isDragging) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging, win.id, updatePosition]);

      if (win.isMinimized) return null;

      const renderAppContent = () => {
        switch (win.appId) {
          case 'printer': return <PrinterSimulator />;
          case 'settings': return <SettingsApp />;
          case 'recycle-bin': return <RecycleBinApp />;
          case 'calculator': return <CalculatorApp />;
          case 'notepad': return <NotepadApp />;
          case 'browser': return <BrowserApp />;
          case 'paint': return <PaintApp />;
          case 'music': return <MusicPlayerApp />;
          case 'camera': return <CameraApp />;
          case 'weather': return <WeatherApp />;
          case 'calendar': return <CalendarApp />;
          case 'task-manager': return <TaskManagerApp />;
          case 'destroyer': return <ProductivityDestroyerApp />;
          case 'malware': return <DefinitelyNotMalwareApp />;
          default: return <div className="p-8 text-center text-slate-400">Application not found.</div>;
        }
      };

      const style = win.isMaximized
        ? { top: 0, left: 0, width: '100vw', height: 'calc(100vh - 48px)', zIndex: win.zIndex }
        : { top: `${win.position.y}px`, left: `${win.position.x}px`, width: `${win.size.width}px`, height: `${win.size.height}px`, zIndex: win.zIndex };

      return (
        <div
          onMouseDown={() => focusWindow(win.id)}
          style={style}
          className={`fixed flex flex-col rounded-2xl glass-window overflow-hidden shadow-2xl transition-all duration-150 ${
            isActive ? 'ring-1 ring-sky-400/40' : 'opacity-95'
          }`}
        >
          {/* Header */}
          <div
            onMouseDown={handleMouseDownHeader}
            className={`flex items-center px-4 py-2.5 bg-slate-950/70 border-b border-slate-800/80 cursor-grab active:cursor-grabbing select-none ${
              isActive ? 'text-slate-100' : 'text-slate-400'
            }`}
          >
            <div className="flex items-center gap-2 font-semibold text-xs tracking-wide">
              <DynamicIcon name={win.iconName} className="w-4 h-4 text-sky-400" />
              <span>{win.title}</span>
            </div>

            <div className="flex items-center space-x-1.5 ml-auto pl-4">
              <button
                onClick={(e) => { e.stopPropagation(); minimizeWindow(win.id); }}
                title="Minimize problem"
                className="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-100 hover:bg-slate-700/50"
              >
                <DynamicIcon name="Minus" className="w-3.5 h-3.5" />
              </button>
              <button
                onClick={(e) => { e.stopPropagation(); toggleMaximizeWindow(win.id); }}
                title="Maximize problem"
                className="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-100 hover:bg-slate-700/50"
              >
                <DynamicIcon name="Square" className="w-3 h-3" />
              </button>
              <button
                onClick={(e) => { e.stopPropagation(); closeWindow(win.id); }}
                title="Close (pretend to exit)"
                className="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-rose-600/80"
              >
                <DynamicIcon name="X" className="w-4 h-4" />
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-hidden relative">{renderAppContent()}</div>
        </div>
      );
    }

          </div>

          <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-xs text-amber-300 font-medium text-center">
            {REQUIRED_MESSAGES.NOTIFICATIONS}
          </div>

          <div className="space-y-2 py-1">
            {[
              { title: 'System', text: 'No notifications.' },
              { title: 'Alerts', text: 'Seriously, nothing.' },
              { title: 'Double-Check', text: 'We checked again.' },
              { title: 'Final Status', text: 'Still nothing.' },
            ].map((item, idx) => (
              <div key={idx} className="p-3 rounded-xl bg-slate-800/40 border border-slate-800 text-xs flex items-center justify-between">
                <div>
                  <h4 className="font-semibold text-slate-300 text-[11px]">{item.title}</h4>
                  <p className="text-slate-400 mt-0.5">{item.text}</p>
                </div>
                <DynamicIcon name="CheckCircle2" className="w-4 h-4 text-slate-600" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- BLUE SCREEN OF DEATH (BSOD) ---
    function BSODOverlay() {
      const { bsodOpen, closeBSOD } = useWindowManager();
      const [dots, setDots] = useState('');

      useEffect(() => {
        if (!bsodOpen) return;
        const interval = setInterval(() => {
          setDots((d) => (d.length >= 4 ? '' : d + '.'));
        }, 600);
        return () => clearInterval(interval);
      }, [bsodOpen]);

      if (!bsodOpen) return null;

      return (
        <div
          onClick={closeBSOD}
          className="fixed inset-0 z-[99999] bg-[#0078d7] text-white p-8 sm:p-16 flex flex-col justify-between font-sans select-none cursor-pointer animate-fade-in"
        >
          <div className="max-w-3xl space-y-6">
            <div className="text-8xl font-light mb-4">:-(</div>
            <h1 className="text-3xl sm:text-4xl font-normal leading-tight">
              Your PC ran into a problem because it realized it is completely useless.
            </h1>
            <p className="text-lg font-light text-blue-100">
              We're just collecting some imaginary error info, and then we won't restart for you.
            </p>
            <div className="text-2xl font-mono text-blue-200">
              0% complete{dots}
            </div>
            <div className="pt-8 text-xs font-mono space-y-1 text-blue-100">
              <div>Stop Code: CRITICAL_LACK_OF_PURPOSE</div>
              <div>What failed: Productivity.sys</div>
            </div>
          </div>
          <div className="text-xs text-blue-200 flex justify-between items-center border-t border-blue-400/30 pt-4">
            <span>Click anywhere to return to the simulated desktop</span>
            <button
              onClick={(e) => { e.stopPropagation(); closeBSOD(); }}
              className="px-4 py-2 rounded-xl bg-white text-blue-800 font-bold"
            >
              Wake Up Computer
            </button>
          </div>
        </div>
      );
    }

    // --- TOAST CONTAINER & ITEM ---
    function ToastContainer() {
      const { toasts, removeToast } = useToast();
      if (toasts.length === 0) return null;

      return (
        <div className="fixed bottom-14 right-4 z-[9999] flex flex-col gap-2.5 pointer-events-auto">
          {toasts.map((toast) => (
            <div
              key={toast.id}
              className={`relative flex items-start gap-3 w-80 sm:w-96 p-4 rounded-xl bg-slate-900/90 backdrop-blur-xl border ${
                toast.type === 'achievement'
                  ? 'border-amber-500/40 shadow-amber-500/10'
                  : toast.type === 'error'
                  ? 'border-rose-500/40 shadow-rose-500/10'
                  : toast.type === 'printer'
                  ? 'border-sky-500/40 shadow-sky-500/10'
                  : 'border-slate-700/60 shadow-black/40'
              } shadow-2xl transition-all animate-scale-in`}
            >
              <div className="shrink-0 mt-0.5 p-2 rounded-lg bg-slate-800/80">
                {toast.type === 'achievement' ? (
                  <DynamicIcon name="Trophy" className="w-5 h-5 text-amber-400 animate-bounce" />
                ) : toast.type === 'error' ? (
                  <DynamicIcon name="ShieldAlert" className="w-5 h-5 text-rose-400" />
                ) : toast.type === 'printer' ? (
                  <DynamicIcon name="Printer" className="w-5 h-5 text-sky-400 animate-pulse" />
                ) : (
                  <DynamicIcon name="AlertTriangle" className="w-5 h-5 text-amber-400" />
                )}
              </div>
              <div className="flex-1 min-w-0">
                <h4 className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-0.5">
                  {toast.title}
                </h4>
                <p className="text-sm font-medium text-slate-100 break-words leading-snug">
                  {toast.message}
                </p>
              </div>
              <button
                onClick={() => removeToast(toast.id)}
                className="shrink-0 text-slate-400 hover:text-slate-100 p-1"
              >
                <DynamicIcon name="X" className="w-4 h-4" />
              </button>
            </div>
          ))}
        </div>
      );
    }

    // --- TASKBAR & CLOCK ---
    function Taskbar({
      startMenuOpen, searchOpen, networkOpen, notificationsOpen,
      onToggleStartMenu, onToggleSearch, onToggleNetwork, onToggleNotifications
    }) {
      const { windows, activeWindowId, openWindow, minimizeWindow, focusWindow } = useWindowManager();
      const { showUselessMessage } = useToast();
      const { soundEnabled, toggleSound } = useSound();
      const { registerStartClick } = useClickTracker();

      const [time, setTime] = useState(new Date());
      useEffect(() => {
        const timer = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const handleTaskbarClick = (e) => {
        if (e.target === e.currentTarget) {
          soundEngine.playClick();
          showUselessMessage(REQUIRED_MESSAGES.TASKBAR, 'Multi-Taskbar', 'warning');
        }
      };

      const handleClockClick = (e) => {
        e.stopPropagation();
        soundEngine.playClick();
        const quotes = [
          'Time is passing. You are still here.',
          "Yes, that's the time. Congratulations.",
          'Another minute has been successfully wasted.',
        ];
        showUselessMessage(quotes[Math.floor(Math.random() * quotes.length)], 'Real-Time Clock', 'info');
      };

      const pinnedApps = FAKE_APPS.filter((a) => a.pinnedInTaskbar);

      return (
        <nav
          onClick={handleTaskbarClick}
          className="fixed bottom-0 left-0 right-0 h-12 glass-taskbar px-3 flex items-center gap-1 z-40 select-none shadow-2xl"
        >
          {/* Start Button */}
          <button
            onClick={(e) => { e.stopPropagation(); soundEngine.playClick(); registerStartClick(); onToggleStartMenu(); }}
            title="Start (Click here and hope)"
            className={`flex items-center justify-center p-2 rounded-xl active:scale-90 transition-all ${
              startMenuOpen ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/30' : 'bg-slate-800/80 hover:bg-slate-700/80 text-sky-400 border border-slate-700/60'
            }`}
          >
            <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
              <path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zm-9 9h7v7H4v-7zm9 0h7v7h-7v-7z" />
            </svg>
          </button>

          {/* Search Button */}
          <button
            onClick={(e) => { e.stopPropagation(); soundEngine.playClick(); onToggleSearch(); }}
            title={REQUIRED_MESSAGES.SEARCH}
            className={`flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs active:scale-95 transition-all ${
              searchOpen ? 'bg-sky-500/20 text-sky-300 border border-sky-500/30' : 'bg-slate-800/60 hover:bg-slate-700/60 text-slate-400 border border-slate-700/40'
            }`}
          >
            <DynamicIcon name="Search" className="w-3.5 h-3.5 text-sky-400" />
            <span className="hidden sm:inline">Search...</span>
          </button>

          <div className="h-5 w-[1px] bg-slate-700/60 mx-1 hidden sm:block" />

          {/* Running/Pinned apps */}
          <div className="flex items-center gap-1 overflow-x-auto max-w-xl py-1">
            {pinnedApps.map((app) => {
              const openWin = windows.find((w) => w.appId === app.id);
              const isOpen = Boolean(openWin);
              const isActive = openWin?.id === activeWindowId && !openWin?.isMinimized;

              return (
                <button
                  key={app.id}
                  onClick={() => {
                    if (!isOpen) openWindow(app.id);
                    else if (isActive) minimizeWindow(openWin.id);
                    else focusWindow(openWin.id);
                  }}
                  title={app.title}
                  className={`relative p-2 rounded-xl transition-all flex items-center justify-center ${
                    isActive ? 'bg-slate-700/80 text-sky-400 border border-sky-400/30' : isOpen ? 'bg-slate-800/60 text-slate-200' : 'hover:bg-slate-800/40 text-slate-400'
                  }`}
                >
                  <DynamicIcon name={app.iconName} className="w-5 h-5" />
                  {isOpen && <span className={`absolute bottom-0.5 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full ${isActive ? 'bg-sky-400' : 'bg-slate-500'}`} />}
                </button>
              );
            })}
          </div>

          {/* System Tray */}
          <div className="flex items-center gap-1 sm:gap-1.5 ml-auto">
            <button
              onClick={(e) => { e.stopPropagation(); toggleSound(); }}
              title={soundEnabled ? 'Mute' : 'Unmute'}
              className="p-1.5 rounded-lg hover:bg-white/10 text-slate-300"
            >
              <DynamicIcon name={soundEnabled ? 'Volume2' : 'VolumeX'} className="w-4 h-4 text-sky-400" />
            </button>

            <button
              onClick={(e) => { e.stopPropagation(); soundEngine.playClick(); onToggleNetwork(); }}
              title="Network"
              className={`p-1.5 rounded-lg ${networkOpen ? 'bg-sky-500/30 text-sky-300' : 'hover:bg-white/10 text-slate-300'}`}
            >
              <DynamicIcon name="Wifi" className="w-4 h-4" />
            </button>

            <button
              onClick={(e) => { e.stopPropagation(); soundEngine.playClick(); onToggleNotifications(); }}
              title="Notifications"
              className={`p-1.5 rounded-lg ${notificationsOpen ? 'bg-sky-500/30 text-sky-300' : 'hover:bg-white/10 text-slate-300'}`}
            >
              <DynamicIcon name="Bell" className="w-4 h-4" />
            </button>

            <div className="h-5 w-[1px] bg-slate-700/60 mx-1" />

            <button
              onClick={handleClockClick}
              title="View useless time"
              className="flex flex-col items-end justify-center px-2 py-1 rounded-lg hover:bg-white/10 text-right"
            >
              <span className="text-xs font-semibold text-slate-200 leading-tight">
                {time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
              </span>
              <span className="text-[10px] text-slate-400 leading-tight">
                {time.toLocaleDateString([], { month: 'short', day: 'numeric' })}
              </span>
            </button>
          </div>
        </nav>
      );
    }

    // --- DESKTOP ICON COMPONENT ---
    function DesktopIcon({ app }) {
      const [shaking, setShaking] = useState(false);
      const { openWindow } = useWindowManager();
      const { showUselessMessage } = useToast();
      const { registerClick } = useClickTracker();

      const handleClick = (e) => {
        e.stopPropagation();
        registerClick(app.id);

        if (app.directAction === 'refuse-folder' || app.directAction === 'refuse-files') {
          soundEngine.playError();
          setShaking(true);
          setTimeout(() => setShaking(false), 500);
          showUselessMessage(REQUIRED_MESSAGES.FILE_ICON, app.title, 'warning');
          return;
        }

        soundEngine.playClick();
        openWindow(app.id);
      };

      return (
        <div
          onClick={handleClick}
          title={app.description}
          className={`group flex flex-col items-center justify-center p-3 rounded-2xl cursor-pointer select-none transition-all duration-200 hover:bg-white/10 active:scale-95 text-center w-24 sm:w-28 ${
            shaking ? 'animate-shake' : ''
          }`}
        >
          <div className="relative p-3.5 rounded-2xl bg-slate-800/60 group-hover:bg-slate-700/80 border border-white/10 group-hover:border-sky-400/40 text-sky-400 group-hover:text-sky-300 shadow-lg shadow-black/30 transition-all">
            <DynamicIcon name={app.iconName} className="w-8 h-8" />
          </div>
          <span className="mt-2 text-xs font-semibold text-slate-200 group-hover:text-white drop-shadow leading-tight break-words max-w-full">
            {app.title}
          </span>
        </div>
      );
    }

    // --- MAIN DESKTOP ENVIRONMENT ---
    function Desktop() {
      const { windows } = useWindowManager();
      const { registerClick } = useClickTracker();

      const [startMenuOpen, setStartMenuOpen] = useState(false);
      const [searchOpen, setSearchOpen] = useState(false);
      const [networkOpen, setNetworkOpen] = useState(false);
      const [notificationsOpen, setNotificationsOpen] = useState(false);

      const closeAllFlyouts = () => {
        setStartMenuOpen(false);
        setSearchOpen(false);
        setNetworkOpen(false);
        setNotificationsOpen(false);
      };

      const handleWallpaperClick = (e) => {
        if (e.target === e.currentTarget) {
          closeAllFlyouts();
          soundEngine.playClick();
          registerClick('desktop-wallpaper', 'Excellent choice. You clicked the wallpaper.');
        }
      };

      const desktopApps = FAKE_APPS.filter((a) => a.onDesktop);

      return (
        <main
          onClick={handleWallpaperClick}
          className="relative w-screen h-screen overflow-hidden select-none bg-slate-950 font-sans"
        >
          {/* Wallpaper background */}
          <div
            className="absolute inset-0 pointer-events-none"
            style={{
              background: `
                radial-gradient(circle at 20% 25%, rgba(56, 189, 248, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 0.5) 0%, transparent 70%),
                linear-gradient(135deg, #090d16 0%, #0f172a 50%, #020617 100%)
              `,
            }}
          />

          <div className="absolute inset-0 opacity-10 pointer-events-none bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:24px_24px]" />

          {/* Desktop Watermark */}
          <div className="absolute top-6 right-8 text-right pointer-events-none z-0">
            <h1 className="text-xl font-extrabold tracking-tight text-white/20 uppercase">
              Useless OS
            </h1>
            <p className="text-[11px] font-mono text-white/10 tracking-widest uppercase">
              Build 0.0.0 (Pure Inefficiency)
            </p>
          </div>

          {/* Desktop Icon Grid */}
          <div
            onClick={handleWallpaperClick}
            className="relative z-10 p-4 sm:p-6 grid grid-flow-col grid-rows-6 auto-cols-max gap-3 sm:gap-4 max-h-[calc(100vh-60px)]"
          >
            {desktopApps.map((app) => (
              <DesktopIcon key={app.id} app={app} />
            ))}
          </div>

          {/* Open Windows */}
          {windows.map((win) => (
            <FakeWindow key={win.id} win={win} />
          ))}

          {/* Flyouts */}
          <StartMenu isOpen={startMenuOpen} onClose={() => setStartMenuOpen(false)} />
          <SearchPanel isOpen={searchOpen} onClose={() => setSearchOpen(false)} />
          <NetworkPanel isOpen={networkOpen} onClose={() => setNetworkOpen(false)} />
          <NotificationCenter isOpen={notificationsOpen} onClose={() => setNotificationsOpen(false)} />

          {/* Taskbar */}
          <Taskbar
            startMenuOpen={startMenuOpen}
            searchOpen={searchOpen}
            networkOpen={networkOpen}
            notificationsOpen={notificationsOpen}
            onToggleStartMenu={() => { closeAllFlyouts(); setStartMenuOpen(!startMenuOpen); }}
            onToggleSearch={() => { closeAllFlyouts(); setSearchOpen(!searchOpen); }}
            onToggleNetwork={() => { closeAllFlyouts(); setNetworkOpen(!networkOpen); }}
            onToggleNotifications={() => { closeAllFlyouts(); setNotificationsOpen(!notificationsOpen); }}
          />

          {/* Toasts */}
          <ToastContainer />

          {/* BSOD */}
          <BSODOverlay />
        </main>
      );
    }

    // --- APP ROOT ---
    function App() {
      return (
        <SoundProvider>
          <ToastProvider>
            <WindowProvider>
              <Desktop />
            </WindowProvider>
          </ToastProvider>
        </SoundProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
